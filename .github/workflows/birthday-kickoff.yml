name: Birthday Kickoff Email (one-time)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (check only, no email)"
        default: "true"
  schedule:
    - cron: "30 0 25 9 *"   # Sept 25 00:30 UTC = 06:00 IST
    - cron: "40 0 25 9 *"   # safety re-check 10 min later

permissions:
  issues: write

jobs:
  kickoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send the birthday kickoff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -e
          YEAR=$(date -u +%Y)
          if [ "$YEAR" != "2026" ]; then
            echo "Not 2026 — one-time event, skipping."
            exit 0
          fi
          echo "Dry run mode: $DRY_RUN"
          EXISTS=$(gh api "repos/$REPO/issues?state=all&per_page=100" --jq '.[].title' 2>/dev/null | grep -c "144 birthday wishes" || true)
          echo "Existing kickoff issues: $EXISTS"
          if [ "$EXISTS" -ge 1 ]; then
            echo "Kickoff already sent — skipping (duplicate guard)."
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN OK — would create the kickoff issue + mention now."
            exit 0
          fi
          gh api "repos/$REPO/issues" \
            -f title="🎂 Kushal — 144 birthday wishes are waiting for you 🎁" \
            -F body=@kickoff_body.md
          echo "Kickoff issue created — mention email on its way."
