name: Birthday Email Sender (144 wishes)

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test email instead of live"
        default: "false"
  schedule:
    # every 5 min, 00:25–12:35 UTC on Sept 25 (6:00–18:00 IST) — year-guarded in code
    - cron: "25,30,35,40,45,50,55 0 25 9 *"
    - cron: "*/5 1-12 25 9 *"

permissions:
  contents: write

concurrency:
  group: birthday-emails
  cancel-in-progress: false

jobs:
  send:
    if: github.repository == 'kushalkumardagaca-png/birthday-card'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send due birthday wishes
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          TEST_TO: ${{ inputs.test == 'true' && secrets.TEST_EMAIL || '' }}
          WISHES_FILE: wishes.json
          STATE_FILE: sent_state.json
          MAX_SEND: "6"
        run: |
          Y=$(date -u +%Y)
          if [ "$Y" != "2026" ]; then echo "one-time event: not 2026, skipping"; exit 0; fi
          python email_sender.py

      - name: Commit send-state (for catch-up safety)
        if: always()
        run: |
          git config user.email "birthday-bot@users.noreply.github.com"
          git config user.name "birthday-bot"
          if [ -f sent_state.json ] && ! git diff --quiet -- sent_state.json 2>/dev/null; then
            git add sent_state.json
            git commit -m "send-state update [skip ci]" || echo "nothing to commit"
            git push || echo "state push skipped"
          else
            echo "state unchanged"
          fi
